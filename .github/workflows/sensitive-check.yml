name: Sensitive Data Check

on:
  workflow_dispatch:
  push:
    branches: [mattboxx]
  pull_request:
    branches: [mattboxx]

jobs:
  scan:
    name: Scan for secrets & sensitive data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Get every tracked file
        id: changed
        run: |
          # The repository is small. Scanning the full tip avoids the blind
          # spot where a multi-commit push introduces a secret in an earlier
          # commit and the last commit does not touch that file.
          FILES=$(git ls-files)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Check for blocked files
        run: |
          set -euo pipefail

          CONFIG=".github/sensitive-patterns.yml"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file $CONFIG not found"
            exit 1
          fi

          # Extract blocked_files patterns from YAML (one glob per line after "- ")
          PATTERNS=$(awk '/^blocked_files:/{found=1; next} /^[a-z]/{found=0} found && /^\s*-\s*"/{gsub(/^\s*-\s*"|"\s*$/,""); print}' "$CONFIG")

          FOUND=0
          CHANGED="${{ steps.changed.outputs.files }}"

          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # Match changed files against the glob pattern
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if echo "$CHANGED" | grep -qF "$file"; then
                echo "::error file=$file::Blocked file detected: '$file' matches pattern '$pattern'"
                FOUND=1
              fi
            done < <(git ls-files "$pattern" 2>/dev/null)
          done <<< "$PATTERNS"

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "❌ Blocked files found! Remove them or update .github/sensitive-patterns.yml"
            exit 1
          fi
          echo "✅ No blocked files found"

      - name: Scan content for secrets
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          pip install --quiet pyyaml || true
          python3 << 'PYTHON_SCRIPT'
          import yaml
          import re
          import sys
          import os
          import fnmatch

          with open(".github/sensitive-patterns.yml") as f:
              config = yaml.safe_load(f)

          changed_files = os.environ.get("CHANGED_FILES", "").strip().split("\n")
          changed_files = [f for f in changed_files if f.strip()]

          rules = config.get("blocked_content", [])
          if not rules:
              print("✅ No content rules defined")
              sys.exit(0)

          found = 0
          for rule in rules:
              name = rule.get("name", "unnamed")
              pattern = rule.get("pattern", "")
              allow_list = rule.get("allow", [])
              exclude_files = rule.get("exclude_files", [])

              if not pattern:
                  continue

              regex = re.compile(pattern)

              for filepath in changed_files:
                  if not filepath or not os.path.isfile(filepath):
                      continue

                  # Check exclude_files globs
                  excluded = False
                  for exc in exclude_files:
                      if fnmatch.fnmatch(filepath, exc):
                          excluded = True
                          break
                  if excluded:
                      continue

                  # Skip binary files
                  try:
                      raw = open(filepath, "rb").read()
                  except Exception:
                      continue
                  # Text rules such as RFC1918 addresses and PEM parser
                  # markers produce false positives in compiled firmware.
                  # Binary artifacts get a separate high-confidence scan below.
                  if b"\x00" in raw:
                      continue
                  lines = raw.decode("utf-8", errors="ignore").splitlines(True)

                  for line_num, line in enumerate(lines, 1):
                      for match in regex.finditer(line):
                          matched_text = match.group(0)
                          # Check allow list (exact match)
                          if matched_text in allow_list:
                              continue
                          preview = matched_text[:60]
                          print(f"::error file={filepath},line={line_num}::{name}: found '{preview}' in {filepath}:{line_num}")
                          found += 1

          if found:
              print(f"\n❌ {found} sensitive content match(es) found!")
              sys.exit(1)

          print("✅ No sensitive content found")
          PYTHON_SCRIPT

      - name: Scan binary release artifacts
        run: |
          python3 << 'PYTHON_SCRIPT'
          import base64
          import pathlib
          import re
          import sys
          import zipfile

          artifacts = pathlib.Path("flash-package")
          blobs = []
          for path in artifacts.glob("*.bin"):
              blobs.append((str(path), path.read_bytes()))
          for archive in artifacts.glob("*.zip"):
              with zipfile.ZipFile(archive) as zf:
                  for name in zf.namelist():
                      blobs.append((f"{archive}:{name}", zf.read(name)))

          rules = {
              "Tailscale/Headscale auth key": rb"\b(?:tskey|hskey)-[A-Za-z0-9_-]{12,}",
              "GitHub token": rb"\b(?:gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,})\b",
              "Cloudflare API token": rb"\bcfat_[A-Za-z0-9_-]{20,}\b",
              "AWS access key": rb"\bAKIA[0-9A-Z]{16}\b",
              "Google API key": rb"\bAIza[0-9A-Za-z_-]{30,}\b",
              "JWT": rb"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}",
              "Credentials embedded in URL": rb"https?://[^\s/:@]+:[^\s/@]+@",
              "Developer home path": rb"(?i)(?:[A-Z]:\\Users\\|/Users/|/home/)[^\\/\x00\s]+",
          }
          failures = []
          for source, data in blobs:
              for name, pattern in rules.items():
                  if re.search(pattern, data):
                      failures.append((name, source))

              # Libraries contain literal BEGIN/END strings for their PEM
              # parsers. Flag only a syntactically complete, base64-decodable
              # DER private-key block, not those harmless parser constants.
              pem = re.compile(
                  rb"-----BEGIN ((?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY)-----\s+"
                  rb"([A-Za-z0-9+/=\r\n]{40,})-----END \1-----")
              for match in pem.finditer(data):
                  try:
                      decoded = base64.b64decode(
                          re.sub(rb"\s+", b"", match.group(2)), validate=True)
                  except Exception:
                      continue
                  if len(decoded) > 16:
                      failures.append(("Embedded private key", source))

          for name, source in failures:
              print(f"::error file={source}::{name} found in release artifact")
          if failures:
              sys.exit(1)
          print(f"✅ No secrets found in {len(blobs)} binary/archive payloads")
          PYTHON_SCRIPT
